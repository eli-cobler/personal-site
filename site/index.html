<style>
  :root {
    --bg: #EEF0F4;
    --ink: #101216;
    --muted: #5B6472;
    --hl: rgba(16, 18, 22, 0.08);
    --hover: rgba(16, 18, 22, 0.08);
    --glass-bg: rgba(255, 255, 255, 0.38);

    --glass-shadow: rgba(30, 40, 60, 0.16);

    --glow-b: #AFE0F0;
    --glow-c: #FFD3C2;
    --font: "Manrope", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114;
      --ink: #F1F2F4;
      --muted: #9AA1AC;
      --hl: rgba(241, 242, 244, 0.1);
      --hover: rgba(241, 242, 244, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-shadow: rgba(0, 0, 0, 0.45);
      --glow-a: #5B4A99;
      --glow-b: #2E5A66;
      --glow-c: #7A4A3C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114;
    --ink: #F1F2F4;
    --muted: #9AA1AC;
    --hl: rgba(241, 242, 244, 0.1);
    --hover: rgba(241, 242, 244, 0.1);
    --glass-bg: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.16);
    --glass-shadow: rgba(0, 0, 0, 0.45);
    --glow-a: #5B4A99;
    --glow-b: #2E5A66;
    --glow-c: #7A4A3C;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 500;
    line-height: 1.5;
    position: relative;
    overflow-x: hidden;
  }

  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .glow span {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
  }
  .glow span:nth-child(1) {
    width: 26rem; height: 26rem;
    background: var(--glow-a);
    top: -8rem; left: -6rem;
  }
  .glow span:nth-child(2) {
    width: 22rem; height: 22rem;
    background: var(--glow-b);
    bottom: -9rem; right: -5rem;
  }
  .glow span:nth-child(3) {
    width: 18rem; height: 18rem;
    background: var(--glow-c);
    top: 45%; left: 60%;
    transform: translate(-50%, -50%);
    opacity: 0.35;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .glow span { opacity: 0.28; }
    :root:not([data-theme="light"]) .glow span:nth-child(3) { opacity: 0.18; }
  }
  :root[data-theme="dark"] .glow span { opacity: 0.28; }
  :root[data-theme="dark"] .glow span:nth-child(3) { opacity: 0.18; }

  main { width: 100%; max-width: 60rem; margin: 0 auto; padding: 2rem 1.75rem; text-align: center; position: relative; z-index: 1; }

  .card {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(2.25rem, 6vw, 3.5rem) clamp(2rem, 8vw, 4.5rem);
    border-radius: 2rem;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 0 0 rgba(255, 255, 255, 0.5) inset,
      0 8px 32px var(--glass-shadow);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card {
      box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.06) inset, 0 8px 32px var(--glass-shadow);
    }
  }
  :root[data-theme="dark"] .card {
    box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.06) inset, 0 8px 32px var(--glass-shadow);
  }

  .photo {
    width: clamp(6.5rem, 20vw, 9.5rem);
    height: clamp(6.5rem, 20vw, 9.5rem);
    border-radius: 50%;
    overflow: hidden;
    background: var(--hl);
    color: var(--muted);
    margin: 0 auto 2.25rem;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    border: 1px solid var(--glass-border);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo svg { width: 70%; height: 70%; display: block; }

  h1 {
    font-weight: 300;
    font-size: clamp(2.75rem, 9vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.045em;
    margin: 0;
  }

  .rule { width: 3rem; height: 2px; background: var(--ink); margin: 2.5rem auto 1.5rem; }

  nav { display: flex; justify-content: center; gap: 0.5rem; }
  nav a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    color: var(--ink);
    transition: background-color 0.2s ease;
  }
  nav a {
    -webkit-backdrop-filter: blur(0px);
    backdrop-filter: blur(0px);
    transition: background-color 0.2s ease, backdrop-filter 0.2s ease;
  }
  nav a:hover {
    background: var(--hover);
    backdrop-filter: blur(12px) saturate(160%);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
  }
  nav svg { width: 1.6rem; height: 1.6rem; display: block; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .notice {
    display: inline-block;
    margin: 1.75rem 0 0;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    background: var(--hl);
    color: var(--muted);
    font-size: 0.95rem;
  }

  .ph { background: var(--hl); border-radius: 3px; padding: 0 0.15em; }

  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .word { white-space: nowrap; }
  .c { visibility: hidden; position: relative; }
  .c.on { visibility: visible; }
  .c.cur::after {
    content: '';
    position: absolute;
    bottom: 0.16em;
    width: 0.5em;
    height: 0.07em;
    background: var(--ink);
    visibility: visible;
  }
  .c.cur.end::after { left: 100%; margin-left: 0.04em; }
  .c.cur.start::after { left: 0; }
  #typed.idle .c.cur::after { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { nav a { transition: none; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><span></span><span></span><span></span></div>

  <nav aria-label="Contact and links">

<script>
(function () {
  var el = document.getElementById('typed');
  if (!el) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var text = el.textContent;
  el.textContent = '';
  var chars = [];
  text.split(' ').forEach(function (word, i, all) {
    var w = document.createElement('span');
    w.className = 'word';
    word.split('').forEach(function (ch) {
      var c = document.createElement('span');
      c.className = 'c';
      c.textContent = ch;
      w.appendChild(c);
      chars.push(c);
    });
    el.appendChild(w);
    if (i < all.length - 1) el.appendChild(document.createTextNode(' '));
  });

  var n = 0;

  function render() {
    chars.forEach(function (c, i) {
      c.classList.toggle('on', i < n);
      c.classList.remove('cur', 'end', 'start');
    });
    var target = n > 0 ? chars[n - 1] : chars[0];
    target.classList.add('cur', n > 0 ? 'end' : 'start');
  }

  function idle(on) { el.classList.toggle('idle', on); }

  function type() {
    idle(false);
    if (n < chars.length) {
      n++;
      render();
      setTimeout(type, 70 + Math.random() * 60);
    } else {
      idle(true);
      setTimeout(erase, 2200);
    }
  }

  function erase() {
    idle(false);
    if (n > 0) {
      n--;
      render();
      setTimeout(erase, 45);
    } else {
      idle(true);
      setTimeout(type, 700);
    }
  }

  render();
  idle(true);
  setTimeout(type, 500);
})();
</script>
