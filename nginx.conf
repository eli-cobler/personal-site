server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Security headers (the page uses Google Fonts and inline styles/scripts)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache images, fonts, and the résumé for a week
    location ~* \.(png|jpe?g|webp|svg|ico|woff2|pdf)$ {
        expires 7d;
    }
}
